<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>YoYo Player</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <img src="icons/icon32.png" alt="" width="20" height="20">
    <h1>YoYo Player</h1>
  </header>

  <button id="popout" class="primary" type="button" disabled>Pop out</button>
  <button id="float" class="secondary" type="button" disabled>Float in page</button>
  <p id="status" role="status">Looking for a video…</p>

  <div class="options">
    <label class="option" id="autoPip-row">
      <input type="checkbox" id="autoPip">
      <span>Pop out when I switch tabs</span>
    </label>
    <label class="option">
      <input type="checkbox" id="autoFloat">
      <span>Float in page when I scroll past a playing video</span>
    </label>
    <div class="companion" id="companion-row" hidden>
      <label class="option">
        <input type="checkbox" id="companion" disabled>
        <span>Show over full-screen apps</span>
      </label>
      <p class="companion-note" id="companion-note" hidden>
        <span id="companion-text"></span>
        <button class="link" id="companion-allow" type="button" hidden>Allow</button>
        <a id="companion-get" href="https://github.com/Roninbash/yoyo-player#full-screen-apps-on-mac-yoyo-companion" target="_blank" rel="noopener" hidden>Get the Mac app</a>
      </p>
    </div>

  <p class="hint" id="shortcut-hint">
    Pop out: <kbd id="key-pop-out">not set</kbd><br>
    Float in page: <kbd id="key-float">not set</kbd>
    <a href="#" id="shortcuts">change</a>
  </p>

  <script src="send.js"></script>
  <script src="popup.js"></script>
</body>
</html>
